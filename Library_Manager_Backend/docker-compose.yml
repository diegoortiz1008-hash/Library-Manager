services:
  db:
    image: postgres:16
    container_name: postgres-biblioteca
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-biblioteca_db}
      - POSTGRES_USER=${POSTGRES_USER:-prueba}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-prueba}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prueba} -d ${POSTGRES_DB:-biblioteca_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: libreria-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - DB_URI=jdbc:postgresql://db:5432/${POSTGRES_DB:-biblioteca_db}
      - DB_USER=${POSTGRES_USER:-prueba}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-prueba}
      - DB_DRIVER=org.postgresql.Driver
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
